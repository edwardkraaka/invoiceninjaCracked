# Invoice Ninja Nginx Configuration
# Optimized for PHP-FPM container on port 9000

# Global settings
client_max_body_size 100M;
client_body_buffer_size 10M;
client_body_timeout 120s;
client_header_timeout 120s;
keepalive_timeout 65;
send_timeout 120s;
server_tokens off;

# FastCGI settings
fastcgi_buffers 32 16k;
fastcgi_buffer_size 32k;
fastcgi_busy_buffers_size 64k;
fastcgi_temp_file_write_size 64k;
fastcgi_read_timeout 300s;
fastcgi_send_timeout 300s;

# Compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=3r/m;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;
    charset utf-8;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CORS headers for API
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-API-TOKEN, X-API-SECRET, X-API-PASSWORD" always;

    # Handle preflight OPTIONS requests
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Main location block - Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API routes with rate limiting
    location ~ ^/api/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Login/authentication endpoints with stricter rate limiting
    location ~ ^/(login|password|auth)/ {
        limit_req zone=login burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        
        # Handle Flutter web assets specifically
        location ~* \.(dart\.js|dart\.js\.map)$ {
            expires 30d;  # Shorter cache for dart files as they may update
            add_header Cache-Control "public";
        }
        
        # WebAssembly files
        location ~* \.wasm$ {
            add_header Content-Type "application/wasm";
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Canvas Kit assets (Flutter web rendering)
    location /canvaskit/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Specific MIME type for WASM
        location ~* \.wasm$ {
            add_header Content-Type "application/wasm";
        }
    }

    # Admin panel assets
    location /build-admin/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Payment type images
    location /images/payment_types/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fonts
    location /assets/fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Manifest and service worker files
    location ~* \.(manifest|webmanifest)\.json$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Content-Type "application/manifest+json";
    }

    location /flutter_service_worker.js {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Handle robots.txt and favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 1y;
    }

    location = /favicon.png {
        access_log off;
        log_not_found off;
        expires 1y;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        expires 1d;
    }

    # Security - deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security - deny access to sensitive files
    location ~ ^/(\.env|\.git|composer\.|package\.json|webpack\.|gulpfile\.|gruntfile\.|bower\.json) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Prevent access to storage directories (except public storage)
    location ~ ^/storage/(?!public/) {
        deny all;
    }

    # PHP processing
    location ~ \.php$ {
        # Security check - only allow php files in allowed locations
        if ($uri !~ "^/index\.php$") {
            return 404;
        }

        include fastcgi_params;
        fastcgi_pass app:9000;  # PHP-FPM container
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Additional FastCGI params for Laravel
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param HTTP_PROXY "";  # Prevent httpoxy vulnerability
        
        # Handle large uploads
        fastcgi_request_buffering off;
    }

    # WebSocket support for broadcasting (if enabled)
    # Uncomment if using Laravel Echo Server or similar
    # location /socket.io/ {
    #     proxy_pass http://echo-server:6001;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # Handle large file uploads for documents/images
    location /documents {
        client_max_body_size 100M;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /uploads {
        client_max_body_size 100M;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Error pages
    error_page 404 /index.php;
    error_page 403 /index.php;
    error_page 500 502 503 504 /index.php;

    # Logging
    access_log /var/log/nginx/invoiceninja_access.log;
    error_log /var/log/nginx/invoiceninja_error.log warn;

    # Additional security
    location ~ /\. {
        deny all;
    }
}

