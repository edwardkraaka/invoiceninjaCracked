version: '3.7'

services:
  nginx:
    image: nginx
    restart: unless-stopped
    container_name: invoiceninja-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/in-vhost.conf:/etc/nginx/conf.d/default.conf:ro
      - invoiceninja-public:/var/www/html/public:ro
    depends_on:
      - invoiceninja
    networks:
      - invoiceninja-network

  invoiceninja:
    build:
      context: ./invoiceninjaCracked
      dockerfile: Dockerfile.custom
      args:
        PHP: 8.3
    image: invoiceninja/invoiceninja-bypassed:latest
    container_name: invoiceninja
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./.env:/var/www/html/.env:ro
      - invoiceninja-public:/var/www/html/public:rw,delegated
      - invoiceninja-storage:/var/www/html/storage:rw,delegated
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - APP_URL=${APP_URL:-http://localhost}
      - APP_KEY=${APP_KEY:-base64:JsurbG3sctHvwzwCMZX3cuxYfM3tQrcIWB/E0fAcnGQ=}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_ENV=${APP_ENV:-production}
      - REQUIRE_HTTPS=${REQUIRE_HTTPS:-false}
      - PHANTOMJS_PDF_GENERATION=false
      - PDF_GENERATOR=snappdf
      - TRUSTED_PROXIES='*'
      - DB_HOST=invoiceninja-mariadb
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-invoiceninja}
      - DB_USERNAME=${DB_USERNAME:-invoiceninja}
      - DB_PASSWORD=${DB_PASSWORD:-GotDiscardConsonantChauffeur}
      - DB_CONNECTION=mysql
      - DB_STRICT_MODE=false
      - DB_SSLMODE=disable
      - MYSQL_ATTR_SSL_MODE=DISABLED
      - IN_USER_EMAIL=${IN_USER_EMAIL:-admin@example.com}
      - IN_PASSWORD=${IN_PASSWORD:-VehicleInductionPensiveThrush1}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-smtp.example.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-admin@example.com}
      - MAIL_FROM_NAME='Invoice Ninja'
      - NINJA_ENVIRONMENT=selfhost
      - MULTI_DB_ENABLED=false
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - BROADCAST_DRIVER=log
      - LOG_CHANNEL=stack
      - IS_DOCKER=true
    networks:
      - invoiceninja-network
    command: >
      sh -c "
        rm -f /var/www/html/database/schema/mysql-schema.sql &&
        /usr/local/bin/init.sh supervisord -c /etc/supervisor/conf.d/supervisord.conf
      "
    healthcheck:
      test: ["CMD", "pgrep", "-f", "php-fpm: master process"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  mariadb:
    image: linuxserver/mariadb:10.6.10
    container_name: invoiceninja-mariadb
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Africa/Harare}
      - PUID=1000
      - PGID=1000
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-RemunerationPendantBroomIntrusion}
      - MYSQL_DATABASE=${DB_DATABASE:-invoiceninja}
      - MYSQL_USER=${DB_USERNAME:-invoiceninja}
      - MYSQL_PASSWORD=${DB_PASSWORD:-GotDiscardConsonantChauffeur}
    volumes:
      - ./mariadb:/config
    networks:
      - invoiceninja-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME:-invoiceninja}", "-p${DB_PASSWORD:-GotDiscardConsonantChauffeur}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: invoiceninja-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - invoiceninja-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  invoiceninja-public:
    driver: local
  invoiceninja-storage:
    driver: local
  redis-data:
    driver: local

networks:
  invoiceninja-network:
    driver: bridge