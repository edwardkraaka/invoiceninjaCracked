services:
  nginx:
    image: nginx
    restart: unless-stopped
    container_name: invoiceninja-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/in-vhost.conf:/etc/nginx/conf.d/default.conf:ro
      - invoiceninja-public:/var/www/html/public:ro
      - invoiceninja-storage:/var/www/html/storage:ro
    depends_on:
      - invoiceninja
    networks:
      - invoiceninja-network

  invoiceninja:
    build:
      context: ./invoiceninjaCracked
      dockerfile: Dockerfile.custom
      args:
        PHP: 8.3
        VITE_API_URL: https://invoicing.goodwings.org
        VITE_IS_HOSTED: false
    # image: invoiceninja/invoiceninja-bypassed:latest  # Commented out - using local build instead
    container_name: invoiceninja
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./.env:/var/www/html/.env:ro
      - invoiceninja-public:/var/www/html/public:rw,delegated
      - invoiceninja-storage:/var/www/html/storage:rw,delegated
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      # Docker-specific overrides (these override .env file values)
      - DB_HOST=invoiceninja-mariadb
      - REDIS_HOST=redis  
      - IS_DOCKER=true
    networks:
      - invoiceninja-network
    command: >
      sh -c "
        rm -f /var/www/html/database/schema/mysql-schema.sql &&
        /usr/local/bin/init.sh supervisord -c /etc/supervisor/conf.d/supervisord.conf
      "
    healthcheck:
      test: ["CMD", "pgrep", "-f", "php-fpm: master process"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  mariadb:
    image: mariadb:10.6
    container_name: invoiceninja-mariadb
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - invoiceninja-mariadb-data:/var/lib/mysql
    networks:
      - invoiceninja-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: invoiceninja-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - invoiceninja-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  invoiceninja-public:
    driver: local
  invoiceninja-storage:
    driver: local
  invoiceninja-mariadb-data:
    driver: local
  redis-data:
    driver: local

networks:
  invoiceninja-network:
    driver: bridge